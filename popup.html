<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Control</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="popup-shell" aria-live="polite">
    <header>
      <img src="icons/unsaved.svg" id="site-icon" width="36" height="36" alt="">
      <div>
        <h1>History Control</h1>
        <div class="subheading" data-i18n="popupSubtitle"></div>
      </div>
    </header>
    <div id="result" class="result loading" role="status">
      <div id="status" data-i18n="popupLoading"></div>
      <strong id="site-host"></strong>
      <code id="site-url"></code>
      <div id="rule-note" class="rule-note" hidden></div>
    </div>
    <p class="hint" data-i18n="popupHint"></p>
    <button id="manage" type="button" data-i18n="popupManage"></button>
  </main>
</body>
</html>
